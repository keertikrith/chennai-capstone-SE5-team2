services:
  postgres:
    image: postgres:16-alpine
    profiles: ["platform"]
    environment:
      POSTGRES_DB: ${DB_NAME:-springboot_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./databases/postgreSQL/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./databases/postgreSQL/migrations/002_add_query_indexes.sql:/docker-entrypoint-initdb.d/002_add_query_indexes.sql:ro
      - ./databases/postgreSQL/seed/001_seed.sql:/docker-entrypoint-initdb.d/003_seed.sql:ro
      - ./services/auth_service/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/004_auth_service_schema.sql:ro
      # Sprint 10 extensions: preferences, notifications, price alerts, realised P&L
      - ./databases/postgreSQL/migrations/003_extensions.sql:/docker-entrypoint-initdb.d/005_extensions.sql:ro
      - ./databases/postgreSQL/migrations/004_sprint10_ui_enhancements.sql:/docker-entrypoint-initdb.d/006_sprint10_ui_enhancements.sql:ro
      # Automated trading: the strategies customers set up
      - ./databases/postgreSQL/migrations/005_automation.sql:/docker-entrypoint-initdb.d/007_automation.sql:ro
      - ./databases/postgreSQL/migrations/006_automation_history.sql:/docker-entrypoint-initdb.d/008_automation_history.sql:ro
      # AI assistant (MCP) access: connector links, prepared orders, audit trail
      - ./databases/postgreSQL/migrations/007_mcp_access.sql:/docker-entrypoint-initdb.d/009_mcp_access.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-springboot_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - trading-net

  auth-stub:
    profiles: ["stub"]
    build:
      context: .
      dockerfile: services/auth-stub/Dockerfile
    environment:
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
    ports:
      - "${AUTH_STUB_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - trading-net

  auth-service:
    profiles: ["platform"]
    build:
      context: ./services/auth_service
      dockerfile: Dockerfile
    environment:
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-springboot_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Welcome emails carrying a new customer's default password. Without SMTP_HOST,
      # admin registration is refused rather than creating a user nobody can tell the password to.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Optional: a sign-in link to put in the welcome email. Leave empty for no link.
      APP_LOGIN_URL: ${APP_LOGIN_URL:-}
    ports:
      - "${AUTH_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - trading-net

  backend:
    profiles: ["platform"]
    build:
      context: ./services/trade-api
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-springboot_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
      AUTH_BASE_URL: http://auth-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Consumer groups of the Sprint 10 modules, one per module and never shared (see
      # services/trade-api/README.md). They default to these values; listed here so they are visible.
      KAFKA_WATCHLIST_GROUP: watchlist-service
      KAFKA_NOTIFICATIONS_GROUP: notification-service
      KAFKA_PORTFOLIO_GROUP: portfolio-service
      # Portfolio pricing. The key stays in the environment of this container; the browser never sees it.
      FAUXNANCE_BASE_URL: ${FAUXNANCE_BASE_URL:-http://localhost:8080}
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY:-}
      # The e-mail notification channel. Without SMTP_HOST it records a masked stub line instead of sending.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # The in-app assistant. The Gemini key lives only in this container's environment (set it in .env, which is
      # git-ignored); the browser never sees it. Without it the assistant still answers from account data.
      # Automated trading demo button (places a REAL order from a scripted price path). Off unless set to true.
      AUTOMATION_SIMULATION: ${AUTOMATION_SIMULATION:-false}
      # AI assistant (MCP) access. The service key is shared with the mcp-server container and gates /internal/mcp/**;
      # empty means that API refuses everything. MCP_PUBLIC_URL is where customers reach the mcp-server (https in production).
      MCP_SERVICE_KEY: ${MCP_SERVICE_KEY:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:8090}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    ports:
      - "${TRADE_API_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - trading-net

  # Lets an AI assistant (Claude, ChatGPT) use a customer's account through a link they make in Settings.
  # It holds no business rules and no database access: everything goes through the Trade API.
  mcp-server:
    profiles: ["platform"]
    build:
      context: ./services/mcp-server
      dockerfile: Dockerfile
    environment:
      PORT: 8090
      TRADE_API_URL: http://backend:8084
      # Required: the server exits at start-up with a clear message when this is empty.
      MCP_SERVICE_KEY: ${MCP_SERVICE_KEY:-}
      # Origins allowed to call the link from a browser. Assistants' servers send none, so leave empty.
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      MCP_RATE_PER_MINUTE: ${MCP_RATE_PER_MINUTE:-60}
    ports:
      - "${MCP_PORT:-8090}:8090"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 3s
      retries: 8
      start_period: 10s
    networks:
      - trading-net

  trade-executor:
    profiles: ["platform"]
    build:
      context: ./services/executor
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8085
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-springboot_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY}
      FAUXNANCE_BASE_URL: ${FAUXNANCE_BASE_URL:-http://localhost:8080}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
    ports:
      - "${EXECUTOR_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - trading-net

  kafka:
    image: apache/kafka:3.8.0
    profiles: [ "platform" ]
    container_name: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false

    networks:
      - trading-net

  kafka-init:
    image: apache/kafka:3.8.0
    profiles: ["platform"]

    depends_on:
      - kafka

    volumes:
      - ./infrastructure/kafka/scripts/create-topics.sh:/create-topics.sh:ro

    entrypoint: ["/bin/bash", "/create-topics.sh"]

    networks:
      - trading-net

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest 
    profiles: ["platform"]
    ports:
      - "8086:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - trading-net

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube-se5team2
    profiles: ["sonar"]
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - trading-net

  # ---------------------------------------------------------------------------
  # Sonar scan services (profile: sonar-scan)
  # Usage:
  #   docker compose --profile sonar-scan run --rm sonar-scan-executor
  #   docker compose --profile sonar-scan run --rm sonar-scan-trade-api
  #   docker compose --profile sonar-scan run --rm sonar-scan-pipeline
  # Requires sonarqube to be running: docker compose --profile sonar up -d
  # ---------------------------------------------------------------------------

  sonar-scan-executor:
    image: maven:3.9.9-eclipse-temurin-21
    profiles: ["sonar-scan"]
    working_dir: /workspace
    volumes:
      - ./services/executor:/workspace
      - maven-repo:/root/.m2
    environment:
      SONAR_TOKEN: ${SONAR_TOKEN}
    # projectKey, projectName, host.url are in executor/pom.xml <properties>
    # host.url override: inside Docker the server is reachable via service name, not localhost
    entrypoint: ["mvn", "-B",
      "clean", "verify", "sonar:sonar",
      "-Dsonar.host.url=http://sonarqube:9000",
      "-Dsonar.token=${SONAR_TOKEN}"]
    networks:
      - trading-net

  sonar-scan-trade-api:
    image: maven:3.9.9-eclipse-temurin-21
    profiles: ["sonar-scan"]
    working_dir: /workspace
    volumes:
      - ./services/trade-api:/workspace
      - maven-repo:/root/.m2
    environment:
      SONAR_TOKEN: ${SONAR_TOKEN}
    # projectKey, projectName, host.url are in trade-api/pom.xml <properties>
    entrypoint: ["mvn", "-B",
      "clean", "verify", "sonar:sonar",
      "-Dsonar.host.url=http://sonarqube:9000",
      "-Dsonar.token=${SONAR_TOKEN}"]
    networks:
      - trading-net

  sonar-scan-pipeline:
    image: sonarsource/sonar-scanner-cli
    profiles: ["sonar-scan"]
    working_dir: /usr/src
    volumes:
      - ./ETL_Layer:/usr/src
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN}
    # sonar-project.properties in analytics/ carries projectKey, sources, tests, coverage path
    networks:
      - trading-net

volumes:
  postgres-data:
  sonarqube-data:
  sonarqube-logs:
  sonarqube-extensions:
  maven-repo:

networks:
  trading-net:
    name: trading-net