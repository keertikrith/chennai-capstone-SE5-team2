services:
  postgres:
    image: postgres:16-alpine
    profiles: ["platform"]
    environment:
      POSTGRES_DB: ${DB_NAME:-capstone_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres_database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./postgres_database/migrations/002_add_query_indexes.sql:/docker-entrypoint-initdb.d/002_add_query_indexes.sql:ro
      - ./postgres_database/seed/001_seed.sql:/docker-entrypoint-initdb.d/003_seed.sql:ro
      - ./services/auth_service/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/004_auth_service_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-capstone_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - trading-net

  auth-stub:
    profiles: ["stub"]
    build:
      context: .
      dockerfile: services/auth-stub/Dockerfile
    environment:
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
    ports:
      - "${AUTH_STUB_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - trading-net

  auth-service:
    profiles: ["platform"]
    build:
      context: ./services/auth_service
      dockerfile: Dockerfile
    environment:
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-capstone_db}
      DB_SCHEMA: ${AUTH_DB_SCHEMA:-auth}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${AUTH_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - trading-net

  backend:
    profiles: ["platform"]
    build:
      context: ./backend/trade-api
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-capstone_db}
      DB_SCHEMA: ${TRADE_DB_SCHEMA:-trade}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-auth-service}
      AUTH_BASE_URL: http://auth-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${TRADE_API_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - trading-net

  trade-executor:
    profiles: ["platform"]
    build:
      context: ./backend/executor
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8085
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-capstone_db}
      DB_SCHEMA: ${TRADE_DB_SCHEMA:-trade}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY}
      FAUXNANCE_BASE_URL: ${FAUXNANCE_BASE_URL:-http://localhost:8080}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
    ports:
      - "${EXECUTOR_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - trading-net

  kafka:
    image: apache/kafka:3.8.0
    profiles: [ "platform" ]
    container_name: kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false

    networks:
      - trading-net

  kafka-init:
    image: apache/kafka:3.8.0
    profiles: ["platform"]

    depends_on:
      - kafka

    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro

    entrypoint: ["/bin/bash", "/create-topics.sh"]

    networks:
      - trading-net

  kafbat-ui:
    image: ghcr.io/kafbat/kafka-ui:latest 
    profiles: ["platform"]
    ports:
      - "8086:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - trading-net

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube-se5team2
    profiles: ["sonar"]
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - trading-net

  # ---------------------------------------------------------------------------
  # Sonar scan services (profile: sonar-scan)
  # Usage:
  #   docker compose --profile sonar-scan run --rm sonar-scan-executor
  #   docker compose --profile sonar-scan run --rm sonar-scan-trade-api
  #   docker compose --profile sonar-scan run --rm sonar-scan-pipeline
  # Requires sonarqube to be running: docker compose --profile sonar up -d
  # ---------------------------------------------------------------------------

  sonar-scan-executor:
    image: maven:3.9.9-eclipse-temurin-21
    profiles: ["sonar-scan"]
    working_dir: /workspace
    volumes:
      - ./backend/executor:/workspace
      - maven-repo:/root/.m2
    environment:
      SONAR_TOKEN: ${SONAR_TOKEN}
    # projectKey, projectName, host.url are in executor/pom.xml <properties>
    # host.url override: inside Docker the server is reachable via service name, not localhost
    entrypoint: ["mvn", "-B",
      "clean", "verify", "sonar:sonar",
      "-Dsonar.host.url=http://sonarqube:9000",
      "-Dsonar.token=${SONAR_TOKEN}"]
    networks:
      - trading-net

  sonar-scan-trade-api:
    image: maven:3.9.9-eclipse-temurin-21
    profiles: ["sonar-scan"]
    working_dir: /workspace
    volumes:
      - ./backend/trade-api:/workspace
      - maven-repo:/root/.m2
    environment:
      SONAR_TOKEN: ${SONAR_TOKEN}
    # projectKey, projectName, host.url are in trade-api/pom.xml <properties>
    entrypoint: ["mvn", "-B",
      "clean", "verify", "sonar:sonar",
      "-Dsonar.host.url=http://sonarqube:9000",
      "-Dsonar.token=${SONAR_TOKEN}"]
    networks:
      - trading-net

  sonar-scan-pipeline:
    image: sonarsource/sonar-scanner-cli
    profiles: ["sonar-scan"]
    working_dir: /usr/src
    volumes:
      - ./analytics:/usr/src
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN}
    # sonar-project.properties in analytics/ carries projectKey, sources, tests, coverage path
    networks:
      - trading-net

volumes:
  postgres-data:
  sonarqube-data:
  sonarqube-logs:
  sonarqube-extensions:
  maven-repo:

networks:
  trading-net:
    name: trading-net
