spring.application.name=trade-api
server.port=${SERVER_PORT:8084}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:capstone_db}?currentSchema=${DB_SCHEMA:trade}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:<password>}
spring.datasource.driver-class-name=org.postgresql.Driver

mybatis.mapper-locations=classpath*:mapper/**/*.xml

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

app.auth.jwt.secret=${JWT_SECRET}
app.auth.jwt.algorithm=${JWT_ALGORITHM:HS256}
app.auth.jwt.issuer=${JWT_ISSUER:auth-service}
app.auth.base-url=${AUTH_BASE_URL:http://auth-service:8081}

# --- Kafka Producer (idempotent, acks=all) ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retries=2147483647
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
