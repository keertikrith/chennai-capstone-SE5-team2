spring.application.name=trade-executor
server.port=${SERVER_PORT:8085}

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:capstone_db}?currentSchema=${DB_SCHEMA:trade}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- MyBatis ---
mybatis.configuration.map-underscore-to-camel-case=true

# --- Kafka Consumer ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Consumer group is fixed by the contract — do not override via env
app.kafka.consumer-group=trade-executor
spring.kafka.consumer.group-id=trade-executor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual

# --- Kafka Producer (idempotent, acks=all) ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.retries=2147483647
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# --- Topic names ---
app.kafka.topics.orders=orders
app.kafka.topics.trade-events=trade-events
app.kafka.topics.market-data=market-data

app.fauxnance.base-url=${FAUXNANCE_BASE_URL}
app.fauxnance.api-key=${FAUXNANCE_API_KEY}

app.fauxnance.quote-retry.max-attempts=3
app.fauxnance.quote-retry.initial-backoff-ms=300

# --- Executor settlement ---
app.executor.optimistic-lock.max-attempts=3

# --- Market-data poller ---
# POLL_INTERVAL_SECONDS from .env; default 60 s; floor enforced in code
app.poller.interval-seconds=${POLL_INTERVAL_SECONDS:60}

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
