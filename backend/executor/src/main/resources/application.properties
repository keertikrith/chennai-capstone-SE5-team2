spring.application.name=trade-executor
server.port=${SERVER_PORT:8085}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:springboot_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${app.kafka.consumer-group:trade-executor}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record

app.kafka.consumer-group=trade-executor
app.kafka.topics.orders=orders
app.fauxnance.base-url=${FAUXNANCE_BASE_URL:http://localhost:8080}
app.fauxnance.quote-retry.max-attempts=3
app.fauxnance.quote-retry.initial-backoff-ms=300

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
