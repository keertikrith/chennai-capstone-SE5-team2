<header class="header">
  <a class="header__brand" routerLink="/dashboard" aria-label="Quorum home">
    <app-brand-logo [size]="30" />
  </a>

  <nav class="header__nav" aria-label="Primary">
    @for (item of navigationItems(); track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active" #link="routerLinkActive"
         [attr.aria-current]="link.isActive ? 'page' : null">
        {{ item.label }}
        @if (item.path === '/account' && mustChangePassword()) {
          <span class="nav-dot" title="Change your temporary password" aria-label="Action needed"></span>
        }
        @if (item.unread && unread() > 0) {
          <span class="nav-count" [attr.aria-label]="unread() + ' unread messages'" data-testid="unread-badge">{{ unread() > 99 ? '99+' : unread() }}</span>
        }
      </a>
    }
  </nav>

  <div class="header__user">
    <app-theme-toggle />
    <button type="button" class="header__signout" (click)="signOut()" data-testid="sign-out">
      Sign out
    </button>
  </div>
</header>
